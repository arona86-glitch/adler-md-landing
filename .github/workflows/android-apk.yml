name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAI_KEYSTORE_B64: ${{ secrets.HAI_KEYSTORE_B64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional)
        if: env.HAI_KEYSTORE_B64 != ''
        run: echo "$HAI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hai.jks"

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          # Optional: set these repository secrets to sign with your own key.
          # Without them the release APK is signed with the debug key (fine for sideloading).
          HAI_KEYSTORE_PATH: ${{ env.HAI_KEYSTORE_B64 != '' && format('{0}/hai.jks', runner.temp) || '' }}
          HAI_KEYSTORE_PASSWORD: ${{ secrets.HAI_KEYSTORE_PASSWORD }}
          HAI_KEY_ALIAS: ${{ secrets.HAI_KEY_ALIAS }}
          HAI_KEY_PASSWORD: ${{ secrets.HAI_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: hatzolah-air-crm-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-report
          path: android/app/build/reports/
          if-no-files-found: ignore
